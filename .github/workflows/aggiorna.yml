name: Sync Data

on:
  schedule:
    # Gira alle 12:30 e 18:30 italiane (10:30 e 16:30 UTC)
    - cron: '30 10,16 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python cgsse.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add .
          # Il comando seguente evita l'errore se non ci sono modifiche da salvare
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento dati scioperi" && git push)
